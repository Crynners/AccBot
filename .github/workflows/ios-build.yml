name: Build & Test iOS

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
    paths:
      - 'accbot-ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'accbot-ios/**'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: accbot-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            accbot-ios/AccBot.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('accbot-ios/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AccBot.xcodeproj \
            -scheme AccBot \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build
        run: |
          xcodebuild build \
            -project AccBot.xcodeproj \
            -scheme AccBot \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Test
        run: |
          xcodebuild test \
            -project AccBot.xcodeproj \
            -scheme AccBot \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: accbot-ios/TestResults.xcresult
          retention-days: 14
